name: Uppdatera podcast-feeds

on:
  schedule:
    # Onsdag och lördag 06:00 UTC. GitHub kan fördröja körningen upp till
    # en timme vid hög last - spelar ingen roll för poddar.
    - cron: "0 6 * * 3,6"
  workflow_dispatch:        # låter dig köra manuellt från Actions-fliken

permissions:
  contents: write

concurrency:
  group: feed-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Heavy Networking
        run: |
          python pp_feed.py build \
            --show heavy-networking \
            --chunk 200 \
            --output hn.xml \
            --delay 0.5

      - name: Bygg indexsidan
        run: |
          python make_index.py \
            --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

      - name: Committa om något ändrats
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Inget nytt."
          else
            git commit -m "Uppdatera feeds $(date -u +%Y-%m-%d)"
            git push
          fi
